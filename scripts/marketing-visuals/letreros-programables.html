<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!--
  Conceptual visuals for the Letreros Programables proposal (3DNA). Rendered to WebP by
  scripts/marketing-visuals/render.js:  letreros-programables.html?v=<scene>
  Everything is drawn here (canvas LED matrices + type); no client photographs are used.
  Product types, colours, pitches and sizes follow what letrerosprogramables.com lists.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Inter:wght@400;500;600;700;800;900&display=block">
<style>
  html, body { margin: 0; background: #050507; overflow: hidden; }
  #wrap { position: relative; }
  canvas { display: block; }
  .ov { position: absolute; inset: 0; font-family: Inter, sans-serif; color: #fff; }
  .reel-top { position: absolute; left: 34px; right: 34px; top: 40px; display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.78); }
  .reel-top b { color: #ffcf5a; font-weight: 700; }
  .reel-hook { position: absolute; left: 34px; right: 34px; bottom: 118px; font-size: 44px; line-height: 1.02; font-weight: 800; letter-spacing: -.035em; text-shadow: 0 2px 30px rgba(0,0,0,.6); }
  .reel-hook em { font-family: "DM Serif Text", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -.01em; color: #ffcf5a; }
  .reel-foot { position: absolute; left: 34px; right: 34px; bottom: 44px; display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,.82); }
  .reel-foot i { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a3d, #d6249f 60%, #285aeb); display: inline-block; }
  .reel-play { position: absolute; left: 50%; top: 50%; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; background: rgba(255,255,255,.16); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.4); }
  .reel-play::after { content: ""; position: absolute; left: 30px; top: 23px; border-left: 22px solid #fff; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
  .tag { position: absolute; font: 600 13px Inter, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.5); }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas><div class="ov" id="ov"></div></div>
<script src="led.js"></script>
<script>
(async function () {
  await document.fonts.ready;
  await document.fonts.load('800 20px Inter'); await document.fonts.load('900 20px Inter');
  const v = new URLSearchParams(location.search).get("v") || "cover";
  const SIZES = { cover: [1600, 1200], hero: [1920, 1080], reel: [540, 960], fam: [800, 600] };
  const kind = v.startsWith("reel") ? "reel" : v.startsWith("fam") ? "fam" : v;
  const [W, H] = SIZES[kind];
  const c = document.getElementById("c"); c.width = W; c.height = H;
  document.getElementById("wrap").style.cssText = `width:${W}px;height:${H}px`;
  let ctx = c.getContext("2d");
  const ov = document.getElementById("ov");
  const { textMask, sampler, panel, crossMask, spill, reflect, stage, vignette } = LED;

  const RED = "#ff2a1f", AMBER = "#ffb21e", GREEN = "#19ff5e", BLUE = "#2f7bff", WHITE = "#f4f7ff";
  const rainbow = (cx, cols) => `hsl(${Math.round((cx / cols) * 320)},100%,58%)`;

  // a small full-colour "advert" picture for P5/P6 panels
  const promoPicture = (cols, rows, label) => sampler((x, w, h) => {
    const g = x.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, "#ff2d87"); g.addColorStop(.55, "#ff7a1a"); g.addColorStop(1, "#ffd21a");
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = "rgba(20,0,40,.55)"; x.fillRect(0, h * .62, w, h * .38);
    x.fillStyle = "#fff"; x.beginPath(); x.arc(w * .72, h * .3, h * .17, 0, 7); x.fill();
    x.fillStyle = "#fff"; x.font = `900 ${Math.round(h * .3)}px Inter`; x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText(label || "-20%", w * .5, h * .81);
  }, cols, rows);

  // big-type promo frame: gradient + one large word (readable at low resolution)
  const promoWord = (cols, rows, label, from, to) => sampler((x, w, h) => {
    const g = x.createLinearGradient(0, 0, w, h); g.addColorStop(0, from); g.addColorStop(1, to);
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = "#fff"; x.textAlign = "center"; x.textBaseline = "middle";
    let size = h * .8; do { x.font = `900 ${size}px Inter`; size -= .5; } while (x.measureText(label).width > w - 4);
    x.fillText(label, w / 2, h / 2 + 1);
  }, cols, rows);

  const cityPicture = (cols, rows) => sampler((x, w, h) => {
    const g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#2a1fff"); g.addColorStop(.5, "#c43cff"); g.addColorStop(.75, "#ff7a3a"); g.addColorStop(1, "#ffd25a");
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.fillStyle = "#fff4c0"; x.beginPath(); x.arc(w * .5, h * .72, h * .16, 0, 7); x.fill();
    x.fillStyle = "#16083a";
    [[.02,.55,.12],[.15,.45,.1],[.27,.6,.08],[.36,.38,.12],[.5,.52,.1],[.62,.42,.11],[.75,.58,.09],[.85,.47,.13]].forEach(([a, b, c2]) => x.fillRect(w * a, h * b, w * c2, h));
  }, cols, rows);

  function scene_products(W, H, compact, transparent) {
    if (!transparent) stage(ctx, W, H, { floor: .76, haze: "rgba(90,70,255,.13)" });
    const s = W / 1600;
    // full-colour panel (P5-type), back left
    const fcols = 48, fp = Math.round(8.4 * s);
    const fx = Math.round((compact ? 150 : 250) * s), fy = Math.round((compact ? 210 : 150) * s);
    panel(ctx, { x: fx, y: fy, cols: fcols, rows: fcols, pitch: fp, color: cityPicture(fcols, fcols), dot: .86, glow: .8, frame: 12 * s });
    spill(ctx, fx, fy, fcols * fp, fcols * fp, "rgba(190,80,255,1)", .18);
    // pharmacy-style cross, right
    const n = 26, cp = Math.round(13 * s);
    const cx0 = Math.round(W - (compact ? 160 : 290) * s - n * cp), cy0 = Math.round((compact ? 170 : 120) * s);
    const cm = crossMask(n, .36);
    panel(ctx, { x: cx0, y: cy0, cols: n, rows: n, pitch: cp, color: (x, y) => cm(x, y) ? GREEN : null, dot: .8, glow: 1.1, bare: true });
    spill(ctx, cx0, cy0, n * cp, n * cp, "rgba(25,255,94,1)", .22);
    // wide programmable message sign, front centre
    const mcols = 96, mrows = 16, mp = Math.round(9.6 * s);
    const mx = Math.round((W - mcols * mp) / 2), my = Math.round(H * .76 - mrows * mp - 40 * s);
    const tm = textMask("ABIERTO", mcols, mrows, { weight: 800, size: 15.5, spacing: 1 });
    panel(ctx, { x: mx, y: my, cols: mcols, rows: mrows, pitch: mp, color: (x, y) => tm(x, y) ? RED : null, dot: .78, glow: 1.15, frame: 14 * s, radius: 8 * s });
    spill(ctx, mx, my, mcols * mp, mrows * mp, "rgba(255,40,30,1)", .25);
    reflect(ctx, Math.round(H * .76), Math.round(H * .24), .3);
    if (!transparent) vignette(ctx, W, H, .5);
  }

  // --------------------------------------------------------------- product families
  function fam(kind) {
    stage(ctx, W, H, { floor: .8, haze: { letreros: "rgba(255,60,40,.12)", banderolas: "rgba(80,160,255,.12)", pantallas: "rgba(200,80,255,.14)", rotulos: "rgba(47,123,255,.14)", cruces: "rgba(25,255,94,.1)", marcadores: "rgba(255,178,30,.12)" }[kind] });
    const floor = Math.round(H * .8);
    if (kind === "letreros") {
      const cols = 64, rows = 16, p = 10; const x = (W - cols * p) / 2, y = 210;
      const t = textMask("OFERTAS", cols, rows, { size: 15, spacing: .5 });
      panel(ctx, { x, y, cols, rows, pitch: p, color: (cx, cy) => t(cx, cy) ? rainbow(cx, cols) : null, glow: 1.1, frame: 14 });
      spill(ctx, x, y, cols * p, rows * p, "rgba(255,120,60,1)", .2);
    } else if (kind === "banderolas") {
      // projecting double-sided sign on a bracket from a façade
      ctx.fillStyle = "#15151b"; ctx.fillRect(0, 0, 150, floor);
      ctx.fillStyle = "#2b2b33"; ctx.fillRect(150, 214, 70, 8); ctx.fillRect(150, 418, 70, 8);
      const cols = 32, rows = 40, p = 9.5, x = 236, y = 150;
      const t1 = textMask("BAR", cols, 18, { size: 16 }), t2 = textMask("24H", cols, 18, { size: 16 });
      panel(ctx, { x, y, cols, rows, pitch: p, color: (cx, cy) => cy < 19 ? (t1(cx, cy) ? BLUE : null) : cy > 21 ? (t2(cx, cy - 22) ? AMBER : null) : null, glow: 1.1, frame: 12 });
      spill(ctx, x, y, cols * p, rows * p, "rgba(60,140,255,1)", .2);
    } else if (kind === "pantallas") {
      const n = 48, p = 8.4, x = (W - n * p) / 2, y = 70;
      panel(ctx, { x, y, cols: n, rows: n, pitch: p, color: promoPicture(n, n, "-20%"), dot: .88, glow: .8, frame: 12 });
      spill(ctx, x, y, n * p, n * p, "rgba(255,90,90,1)", .2);
    } else if (kind === "rotulos") {
      const cols = 72, rows = 22, p = 9, x = (W - cols * p) / 2, y = 190;
      const t0 = textMask("PARKING", cols - 20, rows, { size: 15 }), t = (cx, cy) => cx >= 20 && t0(cx - 20, cy);
      const pm = textMask("P", 18, rows, { size: 21, weight: 900 });
      panel(ctx, { x, y, cols, rows, pitch: p, color: (cx, cy) => cx < 18 ? (pm(cx, cy) ? WHITE : BLUE) : t(cx, cy) ? WHITE : null, glow: .9, frame: 14 });
      spill(ctx, x, y, cols * p, rows * p, "rgba(47,123,255,1)", .22);
    } else if (kind === "cruces") {
      const n = 28, p = 12, x = (W - n * p) / 2, y = 60, m = crossMask(n, .36);
      panel(ctx, { x, y, cols: n, rows: n, pitch: p, color: (cx, cy) => m(cx, cy) ? GREEN : null, dot: .8, glow: 1.2, bare: true });
      spill(ctx, x, y, n * p, n * p, "rgba(25,255,94,1)", .25);
    } else if (kind === "marcadores") {
      const cols = 80, rows = 32, p = 8, x = (W - cols * p) / 2, y = 120;
      const top = textMask("LOCAL   VISIT.", cols, 9, { size: 8.5, weight: 700 });
      const score = textMask("2 - 1", cols, 14, { size: 14, weight: 900 });
      const time = textMask("45:00", cols, 8, { size: 8, weight: 800 });
      panel(ctx, { x, y, cols, rows, pitch: p, color: (cx, cy) => cy < 9 ? (top(cx, cy) ? WHITE : null) : cy < 23 ? (score(cx, cy - 9) ? RED : null) : (time(cx, cy - 23) ? AMBER : null), glow: 1, frame: 14 });
      spill(ctx, x, y, cols * p, rows * p, "rgba(255,80,40,1)", .2);
    }
    reflect(ctx, floor, H - floor, .32);
    vignette(ctx, W, H, .45);
  }

  // --------------------------------------------------------------- Instagram Reel covers (9:16)
  function storefront(x, y, w, h, lit) {
    ctx.fillStyle = "#17161c"; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#0c0c10"; ctx.fillRect(x + w * .08, y + h * .3, w * .84, h * .7);
    ctx.fillStyle = lit ? "rgba(255,210,140,.18)" : "rgba(255,255,255,.03)"; ctx.fillRect(x + w * .12, y + h * .36, w * .34, h * .5);
    ctx.fillStyle = lit ? "rgba(255,210,140,.12)" : "rgba(255,255,255,.025)"; ctx.fillRect(x + w * .54, y + h * .36, w * .34, h * .64);
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 2; ctx.strokeRect(x + w * .08, y + h * .3, w * .84, h * .7);
  }

  function reel(n) {
    const hook = {
      1: "De local apagado <em>a escaparate que vende.</em>",
      2: "Tu farmacia, <em>visible de día y de noche.</em>",
      3: "Cambia la oferta <em>en segundos.</em>",
      4: "Un letrero <em>para cada negocio.</em>",
      5: "Programarlo <em>es así de fácil.</em>",
      6: "Letreros <em>que se ven.</em>"
    }[n];
    stage(ctx, W, H, { floor: 0, top: "#101016", bottom: "#030304", haze: ["", "rgba(255,60,40,.16)", "rgba(25,255,94,.12)", "rgba(255,120,30,.16)", "rgba(90,120,255,.16)", "rgba(47,123,255,.16)", "rgba(255,178,30,.14)"][n] });
    if (n === 1) {
      // before (top, sign off) / after (bottom, sign on)
      const t = textMask("ABIERTO", 56, 10, { size: 10 });
      [[96, false], [440, true]].forEach(([y, on]) => {
        storefront(70, y + 70, 400, 230, on);
        panel(ctx, { x: 88, y, cols: 56, rows: 10, pitch: 6.5, color: (a2, b2) => on && t(a2, b2) ? RED : null, glow: on ? 1.2 : 0, frame: 8 });
        if (on) spill(ctx, 88, y, 364, 65, "rgba(255,40,30,1)", .32);
        else { ctx.fillStyle = "rgba(0,0,0,.4)"; ctx.fillRect(40, y - 20, 460, 340); }
      });
      ctx.fillStyle = "rgba(255,255,255,.18)"; ctx.fillRect(40, 408, 460, 1);
      ov.insertAdjacentHTML("beforeend", `<span class="tag" style="left:34px;top:62px">Antes</span><span class="tag" style="left:34px;top:410px;color:#ffcf5a">Después</span>`);
    } else if (n === 2) {
      const k = 24, p = 13, m = crossMask(k, .36), x = (W - k * p) / 2, y = 190;
      panel(ctx, { x, y, cols: k, rows: k, pitch: p, color: (a, b) => m(a, b) ? GREEN : null, glow: 1.25, bare: true });
      spill(ctx, x, y, k * p, k * p, "rgba(25,255,94,1)", .3);
      const t = textMask("24H", 30, 12, { size: 12 });
      panel(ctx, { x: (W - 30 * 7) / 2, y: 560, cols: 30, rows: 12, pitch: 7, color: (a, b) => t(a, b) ? GREEN : null, glow: 1, frame: 8 });
    } else if (n === 3) {
      const n2 = 40, p = 10.5, x = (W - n2 * p) / 2;
      panel(ctx, { x, y: 120, cols: n2, rows: n2 / 2, pitch: p, color: promoWord(n2, n2 / 2, "2x1", "#7b2dff", "#ff2d87"), dot: .86, glow: .8, frame: 10 });
      panel(ctx, { x, y: 380, cols: n2, rows: n2 / 2, pitch: p, color: promoWord(n2, n2 / 2, "-20%", "#ff2d87", "#ffb21e"), dot: .86, glow: .9, frame: 10 });
      ctx.fillStyle = "#ffcf5a"; ctx.font = "800 30px Inter"; ctx.textAlign = "center"; ctx.fillText("↓", W / 2, 362);
    } else if (n === 4) {
      [["HOTEL", WHITE, 110], ["BAR", AMBER, 300], ["TIENDA", BLUE, 490]].forEach(([word, col, y]) => {
        const t = textMask(word, 52, 12, { size: 12 });
        panel(ctx, { x: (W - 52 * 8) / 2, y, cols: 52, rows: 12, pitch: 8, color: (a, b) => t(a, b) ? col : null, glow: 1.1, frame: 10 });
      });
    } else if (n === 5) {
      // phone sending a message to a sign
      const t = textMask("HOLA", 40, 12, { size: 12, weight: 700 });
      panel(ctx, { x: (W - 40 * 10) / 2, y: 120, cols: 40, rows: 12, pitch: 10, color: (a, b) => t(a, b) ? AMBER : null, glow: 1.15, frame: 10 });
      LED.roundRect(ctx, W / 2 - 85, 380, 170, 330, 26); ctx.fillStyle = "#1c1c22"; ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 2; ctx.stroke();
      LED.roundRect(ctx, W / 2 - 72, 398, 144, 294, 16); ctx.fillStyle = "#0b0b0f"; ctx.fill();
      ctx.fillStyle = "#ffcf5a"; ctx.font = "700 22px Inter"; ctx.textAlign = "center"; ctx.fillText("HOLA", W / 2, 470);
      ctx.fillStyle = "rgba(255,255,255,.12)"; LED.roundRect(ctx, W / 2 - 56, 500, 112, 40, 10); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "600 15px Inter"; ctx.fillText("Enviar", W / 2, 526);
      ctx.strokeStyle = "rgba(255,207,90,.8)"; ctx.lineWidth = 3;
      [26, 44, 62].forEach((r) => { ctx.beginPath(); ctx.arc(W / 2, 360, r, Math.PI * 1.2, Math.PI * 1.8); ctx.stroke(); });
    } else if (n === 6) {
      const t1 = textMask("LETREROS", 84, 14, { size: 14 }), t2 = textMask("PROGRAMABLES", 84, 12, { size: 12, weight: 700 });
      panel(ctx, { x: (W - 84 * 5.4) / 2, y: 250, cols: 84, rows: 28, pitch: 5.4, color: (a, b) => b < 14 ? (t1(a, b) ? rainbow(a, 84) : null) : b > 15 ? (t2(a, b - 16) ? WHITE : null) : null, glow: .9, frame: 12 });
    }
    vignette(ctx, W, H, .5);
    const g = ctx.createLinearGradient(0, H * .55, 0, H); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.85)");
    ctx.fillStyle = g; ctx.fillRect(0, H * .55, W, H * .45);
    ov.insertAdjacentHTML("beforeend", `<div class="reel-top"><span>Reel 0${n}</span><b>Concepto 3DNA</b></div>
      <div class="reel-hook">${hook}</div>
      <div class="reel-foot"><i></i><span>Instagram · Facebook · TikTok</span></div>`);
  }

  if (v === "cover") scene_products(W, H, true);
  else if (v === "hero") {
    // the cover composition, set on the right two thirds; the left stays dark for the page headline
    stage(ctx, W, H, { floor: (10 + 1200 * .86 * .76 + (H - 1200 * .86) / 2) / H, haze: "rgba(90,70,255,.10)" });
    const main = ctx, off = document.createElement("canvas"); off.width = 1600; off.height = 1200;
    ctx = off.getContext("2d"); scene_products(1600, 1200, true, true); ctx = main;
    const k = .86, w = 1600 * k, h = 1200 * k;
    const fade = document.createElement("canvas"); fade.width = 1600; fade.height = 1200;
    const fx = fade.getContext("2d"); fx.drawImage(off, 0, 0);
    fx.globalCompositeOperation = "destination-in";
    const gm = fx.createLinearGradient(0, 0, 1600, 0); gm.addColorStop(0, "rgba(0,0,0,0)"); gm.addColorStop(.12, "rgba(0,0,0,1)"); gm.addColorStop(1, "rgba(0,0,0,1)");
    fx.fillStyle = gm; fx.fillRect(0, 0, 1600, 1200);
    ctx.drawImage(fade, W - w + 40, (H - h) / 2 + 10, w, h);
    vignette(ctx, W, H, .35);
  }
  else if (v.startsWith("fam-")) fam(v.slice(4));
  else if (v.startsWith("reel-")) reel(+v.slice(5));
  document.title = "ready";
})();
</script>
</body>
</html>
