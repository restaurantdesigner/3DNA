<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <!-- Built by scripts/build-i18n.js from templates/industrial-plant.html + assets/i18n/industrial.json
       (twin.*) + scripts/industrial-page.js. App: assets/js/industrial/dashboard.js + factories/<id>.js -->
  <title>{{twin.meta.title}}</title>
{{head.i18n}}
  <link rel="stylesheet" href="/assets/fonts/site.css?v=20261010a">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/main.css?v=20261124d">
  <link rel="stylesheet" href="/assets/css/industrial.css?v={{industrial.cssVersion}}">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>

<body class="twpage">
<main id="main" tabindex="-1">
{{twin.html}}
</main>

<!-- 3dna:footer -->
{{layout.footer}}
<!-- /3dna:footer -->
<script src="/assets/js/main.js?v=20261010b"></script>
<script type="module">
  const root = document.querySelector("[data-twin]");
  const ui = JSON.parse(root.querySelector("[data-twin-ui]").textContent);
  const v = "?v={{industrial.jsVersion}}";
  const [{ mountDashboard }, factory] = await Promise.all([
    import("/assets/js/industrial/dashboard.js" + v),
    import(`/assets/js/industrial/factories/${root.dataset.factory}.js` + v)
  ]);
  mountDashboard(root, factory.default, ui, root.dataset.lang);
</script>
</body>
</html>
