<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Built by scripts/build-i18n.js from templates/project.html +
       assets/data/projects.json + assets/i18n/projects.json (one page per project and language) -->
  <title>{{project.meta.title}}</title>
{{head.i18n}}
  <link rel="stylesheet" href="/assets/fonts/site.css?v=20261010a">

  <!-- Three.js for the 360° panoramas (the same version as the other 3DNA pages; loaded only by project-pano.js) -->
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/main.css?v=20261102d">
</head>

<body>
<!-- 3dna:header -->
{{layout.header}}
<!-- /3dna:header -->

<main id="main" tabindex="-1" class="rpage pproj">
{{project.heroHtml}}
  <nav class="rpage-context" aria-label="{{project.contextLabel}}">
    <a class="rpage-context__back" href="{{restaurantsPage.url}}#proyectos"><span aria-hidden="true">&larr;</span> {{project.back}}</a>
    <span class="rpage-context__current" aria-current="page">{{project.name}}</span>
  </nav>

  <div class="pproj__inner">
{{project.bodyHtml}}
  </div>

  <section class="rfinal" aria-labelledby="rfinal-title">
    <h2 class="rfinal__title" id="rfinal-title">{{restaurantsPage.finalCta.heading}}</h2>
    <p class="rfinal__text">{{restaurantsPage.finalCta.text}}</p>
    <button type="button" class="rfinal__cta open-panel" data-track="start_project_clicked" data-track-location="project_final">{{restaurantsPage.finalCta.action}} <span aria-hidden="true">&rarr;</span></button>
  </section>
</main>

<!-- 3dna:footer -->
{{layout.footer}}
<!-- /3dna:footer -->
<script src="/assets/js/main.js?v=20261010b"></script>
<script src="/assets/js/project-hero.js?v=20261102b" defer></script>
<script type="module" src="/assets/js/project-pano.js?v=20261102a"></script>
</body>
</html>
