services:
  - type: web
    name: 3dna-site
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
