<body>

    <div class="page-hero-overlay"></div>

  <div id="site-footer"></div>

  <div id="panel-backdrop"></div>
  <div id="form-panel-root"></div>
  <script>
  (function () {
    const mount = document.getElementById('form-panel-root');
    if (!mount) return;
    fetch('assets/partials/form-panel.html?v=20260501m', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('Failed'); return r.text(); })
      .then(html => {
        mount.innerHTML = html;
        window.__formPanelLoaded = true;
        document.dispatchEvent(new Event('form-panel:ready'));
      })
      .catch(console.error);
  })();
  </script>
  <script src="assets/js/main.js?v=20260501q"></script>
