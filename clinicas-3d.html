<!DOCTYPE html>

<head>

</head>

<body>
  <div id="site-header"></div>

  <!-- ===== PAGE HERO ===== -->
  <section class="page-hero" style="background: #1d7fa8;">
    <video class="video-bg video-vertical" autoplay muted loop playsinline poster="img/sc1.jpg">
      <source src="img/screen7.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>
    <div class="align-container">
      <div class="hero-copy">
        <a class="page-back" href="index.html#sec2">Volver a servicios</a>
        <h1 class="hero-title" style="font-family: 'Ultra', serif !important; font-weight: 400 !important;">
          <span class="hero-title-line">Clínicas en 3D</span>

        <p class="hero-subtitle">
          <span class="fade">Espacios que inspiran seguridad, confianza y credibilidad</span>

        <button class="cta-button open-panel" type="button">Solicitar propuesta</button>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <div id="panel-backdrop"></div>
  <div id="form-panel-root"></div>
  <script>
  (function () {
    const mount = document.getElementById('form-panel-root');
    if (!mount) return;
    fetch('assets/partials/form-panel.html?v=20260501m', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('Failed'); return r.text(); })
      .then(html => {
        mount.innerHTML = html;
        window.__formPanelLoaded = true;
        document.dispatchEvent(new Event('form-panel:ready'));
      })
      .catch(console.error);
  })();
  </script>
  <script src="assets/js/main.js?v=20260501q"></script>
