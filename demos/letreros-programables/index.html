<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Letreros Programables — Concepto de diseño — 3DNA</title>
<!-- Interactive website concept for Letreros Programables, by 3DNA (design prototype, not the client's shop).
     Embedded at the end of the proposal (/es/marketing-digital/letreros-programables/#experiencia-digital).
     Data: data.js · text: i18n.js · logic: app.js -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/assets/fonts/site.css?v=20261010a">
<style>
  :root{
    --navy:#0a1024; --navy2:#0e1530; --ink:#0d1020; --text:#3c4252; --muted:#6b7183; --line:#e5e7ee; --soft:#f5f6f9;
    --blue:#2f6bff; --cyan:#19d3ff; --violet:#8b3dff; --yellow:#ffd21a; --wa:#1fb85a; --wa2:#13924a;
    --r:16px; --hdr:76px;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:auto; }
  body{ margin:0; background:#fff; color:var(--ink); font-family:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  img{ max-width:100%; display:block; }
  a{ color:inherit; }
  h1,h2,h3{ margin:0; letter-spacing:-.025em; }
  .wrap{ width:min(1240px, 100% - 48px); margin:0 auto; }
  .tiny{ margin:18px 0 0; font-size:12.5px; color:var(--muted); }
  .tiny--light{ color:rgba(255,255,255,.6); }
  :focus-visible{ outline:2px solid var(--cyan); outline-offset:3px; }

  /* concept bar (full-screen mode only) */
  .cbar{ position:sticky; top:0; z-index:60; display:flex; align-items:center; justify-content:space-between; gap:12px; height:34px; padding:0 18px; background:#000; color:rgba(255,255,255,.8); font-size:12px; letter-spacing:.04em; }
  .cbar a{ color:#fff; text-decoration:none; font-weight:600; }
  body.is-standalone .hdr{ top:34px; }

  /* header */
  .hdr{ position:absolute; top:0; left:0; right:0; z-index:50; color:#fff; }
  .hdr--solid{ position:sticky; background:var(--navy); box-shadow:0 1px 0 rgba(255,255,255,.06); }
  body.is-standalone .hdr--solid{ top:34px; }
  .hdr__in{ display:flex; align-items:center; gap:28px; height:var(--hdr); width:min(1240px,100% - 48px); margin:0 auto; }
  .hdr__logo img{ width:186px; height:auto; }
  .hdr__nav{ display:flex; gap:26px; margin-left:auto; font-size:14.5px; font-weight:500; }
  .hdr__nav a{ text-decoration:none; opacity:.86; }
  .hdr__nav a:hover{ opacity:1; }
  .hdr__cta{ display:inline-flex; align-items:center; height:42px; padding:0 18px; border-radius:999px; background:#fff; color:var(--ink); font-size:14px; font-weight:600; text-decoration:none; }
  .hdr__burger{ display:none; width:44px; height:44px; margin-left:4px; border:0; background:none; color:#fff; cursor:pointer; }
  .hdr__burger span{ display:block; width:22px; height:2.5px; margin:0 auto; border-radius:2px; background:currentColor; box-shadow:0 7px 0 currentColor, 0 -7px 0 currentColor; }
  .langsel{ position:relative; }
  .langsel__btn{ display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 13px; border:0; border-radius:999px; background:rgba(255,255,255,.14); color:#fff; font:600 13.5px Inter,sans-serif; cursor:pointer; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .langsel__btn i{ width:6px; height:6px; border-right:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(45deg) translateY(-2px); }
  .langsel__menu{ position:absolute; right:0; top:46px; display:none; min-width:170px; padding:6px; border-radius:12px; background:#fff; color:var(--ink); box-shadow:0 20px 50px -12px rgba(0,0,0,.35); }
  .langsel.is-open .langsel__menu{ display:block; }
  .langsel__menu a{ display:flex; gap:12px; padding:9px 12px; border-radius:8px; font-size:14px; font-weight:700; text-decoration:none; }
  .langsel__menu a span{ font-weight:400; color:var(--muted); }
  .langsel__menu a:hover, .langsel__menu a[aria-current]{ background:var(--soft); }
  .mnav{ position:fixed; inset:0; z-index:70; display:none; flex-direction:column; gap:6px; padding:84px 26px 30px; background:var(--navy); color:#fff; }
  body.menu-open .mnav{ display:flex; }
  .mnav > a{ padding:12px 0; border-bottom:1px solid rgba(255,255,255,.1); font-size:22px; font-weight:600; text-decoration:none; }
  .mnav__close{ position:absolute; right:16px; top:14px; width:48px; height:48px; border:0; background:none; color:#fff; font-size:34px; cursor:pointer; }
  .mnav__langs{ display:flex; gap:10px; margin-top:auto; }
  .mnav__langs a{ padding:9px 16px; border:1px solid rgba(255,255,255,.3); border-radius:999px; font-weight:700; text-decoration:none; }
  .mnav__langs a[aria-current]{ background:#fff; color:var(--ink); }

  /* buttons */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:10px; height:54px; padding:0 26px; border-radius:999px; border:0; font:600 16px Inter,sans-serif; text-decoration:none; cursor:pointer; transition:transform .2s ease, box-shadow .2s ease, background .2s ease; }
  .btn:hover{ transform:translateY(-1px); }
  .btn--wa{ background:linear-gradient(180deg,#27c565,var(--wa2)); color:#fff; box-shadow:0 14px 30px -12px rgba(20,170,80,.75), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn--ghost{ border:1px solid rgba(255,255,255,.5); color:#fff; background:rgba(255,255,255,.06); }
  .btn--light{ background:#fff; color:var(--ink); }
  .btn--dark{ background:var(--ink); color:#fff; }

  /* hero */
  .hero{ position:relative; min-height:min(100vh, 860px); display:flex; align-items:flex-end; overflow:hidden; background:#05060c; color:#fff; }
  .hero__media, .hero__media img{ position:absolute; inset:0; width:100%; height:100%; }
  .hero__media img{ object-fit:cover; object-position:72% 50%; }
  .hero__shade{ position:absolute; inset:0; background:linear-gradient(90deg, rgba(5,6,14,.9) 0%, rgba(5,6,14,.65) 38%, rgba(5,6,14,.05) 70%), linear-gradient(0deg, rgba(5,6,14,.6), transparent 40%), linear-gradient(180deg, rgba(5,6,14,.55), transparent 22%); }
  .hero__copy{ position:relative; width:min(1240px,100% - 48px); margin:0 auto; padding:0 0 clamp(56px, 10vh, 110px); }
  .hero h1{ max-width:13.5em; font-size:clamp(40px, 5vw, 76px); line-height:1.02; font-weight:800; letter-spacing:-.04em; text-shadow:0 2px 24px rgba(0,0,0,.35); }
  .hero h1 em{ font-style:normal; color:var(--yellow); white-space:nowrap; }
  .hero__ctas{ display:flex; flex-wrap:wrap; gap:12px; margin-top:34px; }

  /* sections */
  .sec{ padding:clamp(64px, 9vw, 120px) 0; }
  .sec--white{ background:#fff; } .sec--soft{ background:var(--soft); }
  .sec--dark{ background:radial-gradient(ellipse at 70% 0%, #1b1446 0%, #070814 60%); color:#fff; }
  .sec--navy{ background:var(--navy); color:#fff; }
  .page{ padding:clamp(28px, 4vw, 48px) 0 clamp(64px, 8vw, 110px); }
  .sh{ max-width:720px; margin-bottom:clamp(28px, 4vw, 48px); }
  .sh--small{ margin:clamp(56px,7vw,90px) 0 26px; }
  .sh h1, .sh h2{ font-size:clamp(32px, 3.6vw, 52px); line-height:1.04; font-weight:800; }
  .sh--small h2{ font-size:clamp(24px,2.4vw,32px); }
  .sh p{ margin:14px 0 0; font-size:clamp(16px,1.3vw,19px); line-height:1.55; color:var(--text); }
  .sh--light p{ color:rgba(255,255,255,.75); }
  .more{ margin:32px 0 0; }
  .more a{ display:inline-flex; align-items:center; gap:8px; font-weight:600; text-decoration:none; border-bottom:2px solid var(--blue); padding-bottom:3px; }

  .cgrid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(18px,2.4vw,32px); }
  .ccard{ display:flex; flex-direction:column; text-decoration:none; }
  .ccard__media{ position:relative; display:block; aspect-ratio:4/3; overflow:hidden; border-radius:var(--r); background:#0b0d18; }
  .ccard__media img{ width:100%; height:100%; object-fit:cover; transition:transform .8s cubic-bezier(.2,.6,.2,1); }
  .ccard:hover .ccard__media img{ transform:scale(1.04); }
  .ccard__soon{ position:absolute; left:14px; top:14px; padding:6px 11px; border-radius:999px; background:rgba(255,255,255,.92); font-size:12px; font-weight:700; color:var(--ink); }
  .ccard__title{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px; font-size:20px; font-weight:700; letter-spacing:-.02em; }
  .ccard__text{ margin-top:6px; font-size:15px; line-height:1.5; color:var(--text); }
  .acctile{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; gap:6px; padding:22px; background:radial-gradient(circle at 80% 20%, rgba(47,107,255,.55), transparent 55%), radial-gradient(circle at 15% 90%, rgba(139,61,255,.45), transparent 50%), #0b0d18; color:#fff; }
  .acctile span{ font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; opacity:.7; }
  .acctile b{ font-size:20px; line-height:1.2; }
  .acctile--cat span{ font-size:26px; letter-spacing:-.02em; text-transform:none; opacity:1; }

  .pgrid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(16px,2vw,26px); }
  .pgrid--4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
  .pcard{ display:flex; flex-direction:column; overflow:hidden; border:1px solid var(--line); border-radius:var(--r); background:#fff; text-decoration:none; transition:box-shadow .25s ease, transform .25s ease; }
  .pcard:hover{ box-shadow:0 24px 50px -28px rgba(13,16,32,.35); transform:translateY(-2px); }
  .pcard__media{ position:relative; display:block; aspect-ratio:4/3; overflow:hidden; background:#0b0d18; }
  .pcard__media img{ width:100%; height:100%; object-fit:cover; }
  .pcard__new{ position:absolute; left:12px; top:12px; padding:5px 10px; border-radius:999px; background:var(--yellow); color:#111; font-size:12px; font-weight:700; }
  .pcard__body{ display:flex; flex-direction:column; flex:1; padding:16px 18px 18px; }
  .pcard__cat{ font-size:12px; font-weight:600; color:var(--muted); }
  .pcard__name{ margin-top:6px; font-size:16.5px; font-weight:700; line-height:1.3; }
  .pcard__chips{ display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 16px; }
  .pcard__chips span{ padding:4px 9px; border-radius:7px; background:var(--soft); font-size:12px; font-weight:600; color:var(--text); }
  .pcard__foot{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:12px; border-top:1px solid var(--line); }
  .pcard__price{ font-size:16px; font-weight:700; }
  .pcard__price small{ font-size:11.5px; font-weight:500; color:var(--muted); }
  .pcard__go{ display:grid; place-items:center; width:34px; height:34px; border-radius:50%; background:var(--ink); color:#fff; }

  .apps{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px; }
  .app{ position:relative; margin:0; aspect-ratio:3/4; overflow:hidden; border-radius:var(--r); }
  .app img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .app figcaption{ position:absolute; inset:auto 0 0 0; padding:60px 20px 20px; background:linear-gradient(0deg, rgba(5,6,14,.92), transparent); }
  .app b{ display:block; font-size:19px; }
  .app span{ display:block; margin-top:6px; font-size:14px; line-height:1.45; color:rgba(255,255,255,.82); }

  .steps{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin:0; padding:0; list-style:none; }
  .steps li{ padding:28px; border-radius:var(--r); background:var(--soft); }
  .steps__n{ font-family:"DM Serif Text",Georgia,serif; font-size:36px; color:var(--blue); }
  .steps b{ display:block; margin:10px 0 6px; font-size:20px; }
  .steps p{ margin:0; font-size:15.5px; line-height:1.55; color:var(--text); }

  .company{ display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:clamp(32px,5vw,80px); align-items:center; }
  .company__media img{ width:100%; border-radius:var(--r); }
  .company h2{ font-size:clamp(32px,3.4vw,50px); font-weight:800; }
  .company p{ font-size:17px; line-height:1.65; color:rgba(255,255,255,.82); }
  .facts{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin:28px 0 0; padding:24px 0 0; list-style:none; border-top:1px solid rgba(255,255,255,.15); }
  .facts b{ display:block; font-family:"DM Serif Text",Georgia,serif; font-size:26px; font-weight:400; }
  .facts span{ font-size:13.5px; color:rgba(255,255,255,.7); }

  .info{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; margin:0; padding:0; list-style:none; border-top:2px solid var(--ink); }
  .info li{ padding:22px 22px 0 0; }
  .info b{ font-size:16px; }
  .info p{ margin:8px 0 0; font-size:15px; line-height:1.55; color:var(--text); }

  .contact{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:clamp(32px,5vw,80px); align-items:start; }
  .contact h2{ font-size:clamp(32px,3.4vw,50px); font-weight:800; }
  .contact > div > p{ font-size:18px; line-height:1.55; color:rgba(255,255,255,.8); }
  .contact__ctas{ display:flex; flex-wrap:wrap; gap:12px; margin-top:26px; }
  .contact__dl{ margin:0; padding:26px; border-radius:var(--r); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); }
  .contact__dl div{ padding:12px 0; border-bottom:1px solid rgba(255,255,255,.12); }
  .contact__dl dt{ font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; opacity:.6; }
  .contact__dl dd{ margin:6px 0 0; font-size:17px; }
  .contact__dl--dark{ background:var(--soft); border-color:var(--line); color:var(--ink); }
  .contact__dl--dark div{ border-color:var(--line); }

  .ftr{ padding:48px 0 40px; background:#05060c; color:rgba(255,255,255,.7); font-size:14px; }
  .ftr__in{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr); gap:32px; }
  .ftr__logo{ width:170px; margin-bottom:12px; }
  .ftr__nav{ display:flex; flex-direction:column; gap:8px; }
  .ftr__nav a{ text-decoration:none; }
  .ftr__demo p{ margin:0 0 8px; line-height:1.5; }
  .ftr__demo b{ color:#fff; }
  .ftr__k{ margin:6px 0 10px; font-size:11.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.55); }
  .social{ display:flex; gap:10px; margin:0; padding:0; list-style:none; }
  .social a, .social span{ display:grid; place-items:center; width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,.22); color:#fff; transition:background .2s ease, border-color .2s ease; }
  .social a:hover{ background:#fff; color:var(--ink); border-color:#fff; }
  .social .social--proposed{ border-style:dashed; color:rgba(255,255,255,.6); }
  .ftr__note{ margin:10px 0 0; font-size:12px; color:rgba(255,255,255,.5); }

  /* catalogue */
  .crumbs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px; font-size:13.5px; color:var(--muted); }
  .crumbs a{ text-decoration:none; color:var(--ink); }
  .crumbs--light, .crumbs--light a{ color:rgba(255,255,255,.85); }
  .filters{ display:flex; flex-direction:column; gap:12px; margin-bottom:22px; }
  .fgroup{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .fgroup__l{ min-width:84px; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .chip{ padding:8px 14px; border:1px solid var(--line); border-radius:999px; font-size:14px; font-weight:600; text-decoration:none; background:#fff; }
  .chip.is-on{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .chip--clear{ align-self:flex-start; border-style:dashed; }
  .count{ margin:0 0 18px; font-size:14px; color:var(--muted); }
  .empty{ padding:40px; border-radius:var(--r); background:var(--soft); font-size:17px; text-align:center; }
  .cathero{ position:relative; min-height:420px; display:flex; align-items:flex-end; overflow:hidden; color:#fff; background:var(--navy); }
  .cathero > img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cathero__shade{ position:absolute; inset:0; background:linear-gradient(0deg, rgba(5,6,14,.88), rgba(5,6,14,.2) 60%), linear-gradient(180deg, rgba(5,6,14,.5), transparent 30%); }
  .cathero__copy{ position:relative; padding:120px 0 44px; }
  .cathero h1{ font-size:clamp(34px,4.2vw,60px); font-weight:800; }
  .cathero p{ max-width:40em; margin:12px 0 0; font-size:18px; line-height:1.5; color:rgba(255,255,255,.85); }
  .cathero--plain{ min-height:300px; }

  /* product */
  .pd{ display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:clamp(28px,4vw,64px); align-items:start; }
  .pd__media{ position:relative; margin:0; }
  .pd__media img{ width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:var(--r); }
  .pd__media .acctile{ position:relative; aspect-ratio:4/3; border-radius:var(--r); }
  .pd__media figcaption{ margin-top:10px; font-size:12.5px; color:var(--muted); }
  .pd__cat{ margin:0 0 10px; font-size:13px; font-weight:600; color:var(--muted); }
  .pd h1{ font-size:clamp(28px,3vw,42px); line-height:1.08; font-weight:800; }
  .pd__lead{ font-size:17px; line-height:1.55; color:var(--text); }
  .pd__price{ display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 10px; margin:22px 0; padding:18px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .pd__price b{ font-size:30px; letter-spacing:-.02em; }
  .pd__price span{ font-size:14px; color:var(--muted); }
  .pd__price small{ flex-basis:100%; font-size:12.5px; color:var(--muted); }
  .pd__consult{ font-size:22px !important; }
  .pd__ctas{ display:flex; flex-wrap:wrap; gap:10px; }
  .pd__h{ margin:30px 0 12px; font-size:18px; }
  .specs{ width:100%; border-collapse:collapse; font-size:15px; }
  .specs th{ width:44%; padding:11px 12px 11px 0; text-align:left; font-weight:500; color:var(--muted); border-bottom:1px solid var(--line); vertical-align:top; }
  .specs td{ padding:11px 0; border-bottom:1px solid var(--line); font-weight:600; }
  .pd__ref{ margin:22px 0 0; font-size:12.5px; line-height:1.5; color:var(--muted); }
  .pd__ref span{ display:block; font-weight:700; text-transform:uppercase; letter-spacing:.1em; font-size:11px; }

  /* quote */
  .quote{ display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:clamp(28px,4vw,64px); align-items:start; }
  .quote h1{ font-size:clamp(32px,3.6vw,50px); font-weight:800; }
  .notice{ padding:12px 16px; border-radius:12px; background:#fff7d6; color:#5c4a00; font-size:14px; }
  .qform{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px; }
  .qform label{ display:flex; flex-direction:column; gap:6px; font-size:13.5px; font-weight:600; }
  .qform input, .qform select, .qform textarea{ padding:13px 14px; border:1px solid var(--line); border-radius:12px; font:400 15px Inter,sans-serif; background:#fff; }
  .qform__wide, .qform button, .qform__sent{ grid-column:1/-1; }
  .qform button{ justify-self:start; }
  .qform__sent{ margin:0; padding:14px 16px; border-radius:12px; background:var(--soft); font-size:15px; }

  dialog{ max-width:420px; border:0; border-radius:18px; padding:28px; box-shadow:0 30px 80px -20px rgba(0,0,0,.5); }
  dialog::backdrop{ background:rgba(5,6,14,.6); }
  dialog h2{ font-size:20px; }
  dialog p{ font-size:15.5px; line-height:1.55; color:var(--text); }

  /* tablet */
  @media (max-width: 1100px){
    .hdr__nav{ display:none; }
    .hdr__burger{ display:block; }
    .hdr__cta{ margin-left:auto; }
    .cgrid, .pgrid, .pgrid--4{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .apps, .info{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .info li{ padding-bottom:18px; }
  }
  /* phone: the approved image-led hero, everything else below it */
  @media (max-width: 760px){
    :root{ --hdr:68px; }
    .wrap{ width:calc(100% - 40px); }
    .hdr__in{ width:calc(100% - 32px); gap:10px; }
    .hdr__logo img{ width:168px; }
    .hdr__cta{ display:none; }
    .langsel{ margin-left:auto; }
    .hero{ min-height:100vh; min-height:100svh; align-items:flex-end; }
    .hero__media img{ height:66%; object-position:45% 0; -webkit-mask-image:linear-gradient(180deg,#000 70%,transparent); mask-image:linear-gradient(180deg,#000 70%,transparent); }
    .hero__shade{ background:linear-gradient(180deg, rgba(10,10,30,.6), transparent 16%); }
    .hero__copy{ width:calc(100% - 40px); padding-bottom:calc(36px + env(safe-area-inset-bottom)); }
    .hero h1{ font-size:clamp(34px, 10vw, 44px); line-height:1.04; }
    .hero__ctas{ margin-top:24px; }
